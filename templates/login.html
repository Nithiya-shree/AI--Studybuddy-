

<!DOCTYPE html>
<html>
<head>
    <title>AI StudyBuddy - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            background: #eef1ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            box-shadow: 0 4px 20px #0001;
        }
        h2 { color: #4867e8; text-align: center; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 8px;
        }
        input { border: 1px solid #ccc; }
        button {
            background: #4867e8;
            color: white;
            border: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>AI StudyBuddy</h2>
        <p>Login to your account</p>

        <form action="/login" method="POST">
            <input type="text" name="username"
                   placeholder="Username" required>

            <input type="password" name="password"
                   placeholder="Password" required>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
